<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Universo Loro</title>
  <meta name="description" content="Universo Loro" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #111111;
      --muted: #6b7280;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0b0c;
        --fg: #f5f5f5;
        --muted: #9ca3af;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    main { max-width: 640px; }
    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    p {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Universo Loro</h1>
    <p>Página en blanco lista para construir.</p>
  </main>
</body>
</html>
