  </g>
  <g stroke="url(#spectrum)" filter="url(#filament)" opacity=".3">
    <path d="M-100 935C330 1050 750 765 960 475S1370 280 1720 40" stroke-width="9"/>
    <path d="M-80 960C470 1100 740 820 1090 490S1410 300 1760 160" stroke-width="4"/>
